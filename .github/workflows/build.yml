name: Build AssPlug VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: Plugin hochladen
        uses: actions/upload-artifact@v4
        with:
          name: AssPlug-VST3-${{ runner.os }}
          path: build/AssPlug_artefacts/Release/VST3
